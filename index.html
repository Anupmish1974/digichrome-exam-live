<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DigiChrome Exam Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .card {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    h2 {
      margin-top: 10px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
    }

    .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.5;
      margin: 25px 0;
    }

    .option {
      text-align: left;
      background: white;
      color: #111;
      border: 1px solid #ccc;
    }

    .option.selected {
      background: #ddd;
    }

    .option.correct {
      background: #c8f7c5;
      border-color: green;
    }

    .option.wrong {
      background: #ffd0d0;
      border-color: red;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<!-- HOME SCREEN -->
<div class="card" id="homeScreen">

  <h1>DIGICHROME EXAM LAB</h1>

  <p>
    Data Analysis MCQ Practice Exam
  </p>

  <hr>

  <h2>Start Exam</h2>

  <input
    type="text"
    id="studentName"
    placeholder="Enter your name"
  >

  <select id="questionCount">
    <option value="10">10 Questions</option>
    <option value="20" selected>20 Questions</option>
    <option value="30">30 Questions</option>
    <option value="50">50 Questions</option>
    <option value="100">100 Questions</option>
  </select>

  <button onclick="startExam()">
    🚀 Start Exam
  </button>

  <div id="homeStatus" class="status">
    Loading question bank...
  </div>

</div>


<!-- EXAM SCREEN -->
<div class="card hidden" id="examScreen">

  <div class="topbar">

    <div id="questionNumber">
      Question 1
    </div>

    <div id="scoreDisplay">
      Score: 0
    </div>

  </div>

  <div
    class="question"
    id="questionText"
  ></div>

  <div id="options"></div>

  <div
    id="answerStatus"
    class="status"
  >
    Select an answer.
  </div>

  <button
    id="nextButton"
    onclick="nextQuestion()"
    class="hidden"
  >
    Next Question →
  </button>

</div>


<!-- RESULT SCREEN -->
<div class="card hidden" id="resultScreen">

  <h1>🎉 Exam Completed</h1>

  <p id="studentResult"></p>

  <div
    class="score"
    id="finalScore"
  ></div>

  <div id="resultDetails"></div>

  <button onclick="location.reload()">
    🔄 Start New Exam
  </button>

</div>


<script>

  // =====================================================
  // GLOBAL VARIABLES
  // =====================================================

  let allQuestions = [];

  let examQuestions = [];

  let currentQuestion = 0;

  let score = 0;

  let answered = false;

  let studentName = "";


  // =====================================================
  // LOAD QUESTIONS
  // =====================================================

  async function loadQuestions() {

    try {

      const response = await fetch(
        "./questions%20(1).json"
      );

      if (!response.ok) {
        throw new Error(
          "Question file could not be loaded."
        );
      }

      const data = await response.json();

      if (!Array.isArray(data)) {

        throw new Error(
          "Question file format is invalid."
        );

      }

      allQuestions = data;

      document.getElementById("homeStatus").innerText =
        "🟢 " +
        allQuestions.length +
        " questions loaded successfully.";

    }

    catch (error) {

      console.error(error);

      document.getElementById("homeStatus").innerText =
        "🔴 Questions could not be loaded. " +
        error.message;

    }

  }


  // =====================================================
  // START EXAM
  // =====================================================

  function startExam() {

    studentName =
      document
        .getElementById("studentName")
        .value
        .trim();

    const count =
      Number(
        document
          .getElementById("questionCount")
          .value
      );


    if (!studentName) {

      alert("Please enter your name.");

      return;

    }


    if (!allQuestions.length) {

      alert(
        "Questions are not loaded yet. Please wait a moment."
      );

      return;

    }


    // Shuffle questions

    const shuffled =
      [...allQuestions]
        .sort(
          () => Math.random() - 0.5
        );


    examQuestions =
      shuffled.slice(
        0,
        Math.min(
          count,
          shuffled.length
        )
      );


    currentQuestion = 0;

    score = 0;

    answered = false;


    document
      .getElementById("homeScreen")
      .classList.add("hidden");

    document
      .getElementById("resultScreen")
      .classList.add("hidden");

    document
      .getElementById("examScreen")
      .classList.remove("hidden");


    showQuestion();

  }


  // =====================================================
  // SHOW QUESTION
  // =====================================================

  function showQuestion() {

    answered = false;


    const q =
      examQuestions[currentQuestion];


    document
      .getElementById("questionNumber")
      .innerText =
      "Question " +
      (currentQuestion + 1) +
      " / " +
      examQuestions.length;


    document
      .getElementById("scoreDisplay")
      .innerText =
      "Score: " + score;


    document
      .getElementById("questionText")
      .innerText =
      q.question ||
      q.text ||
      "Question";


    const optionsContainer =
      document.getElementById("options");

    optionsContainer.innerHTML = "";


    const options =
      q.options ||
      q.choices ||
      [];


    options.forEach(
      function(option, index) {

        const button =
          document.createElement("button");

        button.className =
          "option";

        button.innerText =
          option;

        button.onclick =
          function() {

            selectAnswer(
              option,
              index,
              button
            );

          };


        optionsContainer
          .appendChild(button);

      }
    );


    document
      .getElementById("answerStatus")
      .innerText =
      "Select your answer.";


    document
      .getElementById("nextButton")
      .classList.add("hidden");

  }


  // =====================================================
  // SELECT ANSWER
  // =====================================================

  function selectAnswer(
    selectedOption,
    selectedIndex,
    clickedButton
  ) {

    if (answered) {
      return;
    }


    answered = true;


    const q =
      examQuestions[currentQuestion];


    const correctAnswer =
      q.answer;


    const buttons =
      document.querySelectorAll(
        ".option"
      );


    buttons.forEach(
      function(button) {

        button.disabled = true;

      }
    );


    // Determine correct answer

    let isCorrect = false;


    if (
      String(correctAnswer)
        .trim()
        .toLowerCase()
      ===
      String(selectedOption)
        .trim()
        .toLowerCase()
    ) {

      isCorrect = true;

    }


    // Also support answer as option index

    if (
      String(correctAnswer)
        === String(selectedIndex)
    ) {

      isCorrect = true;

    }


    // Also support A/B/C/D

    if (
      typeof correctAnswer === "string"
      &&
      correctAnswer.length === 1
    ) {

      const letter =
        String.fromCharCode(
          65 + selectedIndex
        );


      if (
        correctAnswer
          .trim()
          .toUpperCase()
        === letter
      ) {

        isCorrect = true;

      }

    }


    if (isCorrect) {

      score++;

      clickedButton.classList.add(
        "correct"
      );

      document
        .getElementById("answerStatus")
        .innerText =
        "✅ Correct Answer!";

    }

    else {

      clickedButton.classList.add(
        "wrong"
      );


      // Highlight correct option

      buttons.forEach(
        function(button) {

          if (
            String(button.innerText)
              .trim()
              .toLowerCase()
            ===
            String(correctAnswer)
              .trim()
              .toLowerCase()
          ) {

            button.classList.add(
              "correct"
            );

          }

        }
      );


      document
        .getElementById("answerStatus")
        .innerText =
        "❌ Wrong Answer";

    }


    document
      .getElementById("scoreDisplay")
      .innerText =
      "Score: " + score;


    const nextButton =
      document.getElementById(
        "nextButton"
      );


    nextButton.classList.remove(
      "hidden"
    );


    if (
      currentQuestion ===
      examQuestions.length - 1
    ) {

      nextButton.innerText =
        "Finish Exam 🏁";

    }

  }


  // =====================================================
  // NEXT QUESTION
  // =====================================================

  function nextQuestion() {

    if (!answered) {
      return;
    }


    currentQuestion++;


    if (
      currentQuestion >=
      examQuestions.length
    ) {

      finishExam();

      return;

    }


    showQuestion();

  }


  // =====================================================
  // FINISH EXAM
  // =====================================================

  function finishExam() {

    document
      .getElementById("examScreen")
      .classList.add("hidden");


    document
      .getElementById("resultScreen")
      .classList.remove("hidden");


    const total =
      examQuestions.length;


    const percentage =
      Math.round(
        (score / total) * 100
      );


    document
      .getElementById("studentResult")
      .innerText =
      "Student: " + studentName;


    document
      .getElementById("finalScore")
      .innerText =
      score +
      " / " +
      total +
      " (" +
      percentage +
      "%)";


    let message = "";


    if (percentage >= 80) {

      message =
        "🏆 Excellent performance!";

    }

    else if (percentage >= 60) {

      message =
        "👍 Good performance!";

    }

    else if (percentage >= 40) {

      message =
        "📚 Keep practicing!";

    }

    else {

      message =
        "💪 More practice required.";

    }


    document
      .getElementById("resultDetails")
      .innerHTML =
      "<p>" + message + "</p>" +
      "<p>Total Questions: " +
      total +
      "</p>" +
      "<p>Correct Answers: " +
      score +
      "</p>" +
      "<p>Wrong Answers: " +
      (total - score) +
      "</p>";

  }


  // =====================================================
  // LOAD QUESTIONS WHEN PAGE OPENS
  // =====================================================

  loadQuestions();

</script>

</body>
</html>
